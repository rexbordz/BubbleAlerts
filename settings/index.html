<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/rexbordz/widget-core@main/assets/images/favicon.ico">
  <title>Bubble Alerts Settings</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
    }

    #settingsCoreFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="settingsCoreFrame" title="Settings"></iframe>

  <script>
    (async function () {
      const CORE_BASE = 'https://cdn.jsdelivr.net/gh/rexbordz/widget-core@main/core/settings/';
      const frame = document.getElementById('settingsCoreFrame');
      const currentDir = window.location.href.replace(/index\.html(?:\?.*)?$/, '');
      const rootDir = currentDir.replace(/settings\/$/, '');

      const bootConfig = {
        configUrl: currentDir + 'settings.json',
        hooksUrl: currentDir + 'settings.js',
        widgetUrl: rootDir,
        page: {
          widgetTitle: 'Bubble Alerts',
          storageKey: 'bubble-alerts-settings',
          sourceWidth: 1920,   // prefills Width in the Add-Source modal
          sourceHeight: 1080,   // prefills Height
          testButtons: [
            { label: 'Test Twitch', value: 'twitch' },
            { label: 'Test YouTube', value: 'youtube' },
            { label: 'Test Kick', value: 'kick' },
            { label: 'Test Tiktok', value: 'tiktok' }
          ]
        },
      };
      const sessionKey = 'settings-core:' + window.location.pathname;
      sessionStorage.setItem(sessionKey, JSON.stringify(bootConfig));

      // jsDelivr serves .html as text/plain (anti-phishing measure), so the
      // iframe can't navigate to it directly - fetch the markup and inject it
      // via srcdoc instead. A <base> tag keeps its relative asset references
      // resolving against the CDN folder, and since the query string is lost
      // for a srcdoc document, the session key is handed off via a global
      // instead (see the __SETTINGS_SESSION_KEY__ fallback in script.js).
      const html = await fetch(CORE_BASE + 'index.html').then((res) => res.text());
      const injected = html.replace(
        '<head>',
        `<head><base href="${CORE_BASE}"><script>window.__SETTINGS_SESSION_KEY__ = ${JSON.stringify(sessionKey)};<\/script>`
      );
      frame.srcdoc = injected;
    })();
  </script>
</body>
</html>
